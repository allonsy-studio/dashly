name: Deploy docs site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths: ["docs/**", ".github/workflows/pages.yml"]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy to gh-pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This workflow triggers on edits to itself, so the docs/ folder may not exist yet
      # TODO: drop this check once docs/ lands in the project
      - name: Check for docs
        id: docs
        run: |
          if [ -d docs ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish docs/ to gh-pages root
        if: steps.docs.outputs.exists == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
          clean-exclude: pr-preview/

  preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This workflow triggers on edits to itself, so the docs/ folder may not exist yet
      # TODO: drop this check once docs/ lands in the project
      - name: Check for docs
        id: docs
        run: |
          if [ -d docs ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview
        if: steps.docs.outputs.exists == 'true'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
